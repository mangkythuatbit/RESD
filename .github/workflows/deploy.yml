name: Tự động cập nhật Bản đồ sao khi sửa CSV

on:
  push:
    branches:
      - main # Hoặc đổi thành master nếu repo của bạn dùng nhánh master
    paths:
      - '**.csv' # Chỉ chạy khi có thay đổi ở file CSV

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Lấy toàn bộ mã nguồn về máy ảo GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Bước 3: Cài đặt thư viện (Nếu file python của bạn có dùng pandas, openpyxl...)
    # Nếu chạy python thuần không cần thư viện ngoài, bạn có thể xóa 2 dòng dưới
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Bước 4: Chạy file Python để sinh ra file HTML mới
    - name: Run build script
      run: python tools/build_pages.py

    # Bước 5: Tự động commit file HTML mới và đẩy lên GitHub Pages
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add .
        # Chỉ commit nếu có sự thay đổi dữ liệu
        git diff-index --quiet HEAD || git commit -m "Automated update from CSV data"
        git push
